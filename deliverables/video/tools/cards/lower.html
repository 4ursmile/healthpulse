<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lower third</title>
<style>
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:PlexMono;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Plex,system-ui,sans-serif}
.wrap{position:absolute;left:0;right:0;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:10px}
.chip{font:500 19px/1 PlexMono,monospace;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#12696a;padding:9px 14px;border-radius:8px;
  box-shadow:0 6px 18px rgba(0,0,0,.18)}
.cap{max-width:1500px;text-align:center;font-weight:500;font-size:31px;line-height:1.3;color:#fff;background:rgba(14,28,33,.86);
  padding:12px 26px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.chip:empty,.cap:empty{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="chip" id="chip"></div><div class="cap" id="cap"></div></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("chip").textContent = q.get("chip") || "";
document.getElementById("cap").textContent = q.get("cap") || "";
</script>
</body>
</html>
