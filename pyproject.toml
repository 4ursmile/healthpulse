[project]
name = "healthpulse"
version = "3.1.0"
description = "HealthPulse 3.1 — climate-informed disease forecasting, operational simulation and Admin ML Studio"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "pyarrow>=15",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "shapely>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "orjson>=3.9",
  "tifffile>=2024.1",
  "imagecodecs>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mlflow = ["mlflow>=2.12"]

[project.scripts]
hp = "healthpulse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["healthpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
